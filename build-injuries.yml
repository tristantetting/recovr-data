# Save this in your repo at:  .github/workflows/build-injuries.yml
#
# Rebuilds injuries.json from the Google Sheet:
#   - every morning at 4am Central (the daily auto build)
#   - any time you press "Run workflow" in the Actions tab (instant publish)
#
# A keep-alive step bumps a timestamp file on every run so GitHub sees the
# repo as active and does not pause the daily schedule.

name: Build injuries.json

on:
  schedule:
    # 09:00 UTC = 4:00am Central
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the CSV reader
        run: npm install --no-save papaparse@5

      - name: Build injuries.json
        run: node build-injuries.mjs

      - name: Keep the daily schedule awake
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-build

      - name: Save any changes
        run: |
          git config user.name "recovr-bot"
          git config user.email "actions@github.com"
          git add injuries.json .last-build
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Update injury data"
            git push
            echo "Published updated injury data."
          fi
